<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOR Arrivals — ESSA</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="data/stand-apron-map.js"></script>
  <script src="data/mock-chroma.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }

    #app {
      width: 500px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    /* ── Header ── */
    .panel-header {
      background: #e8eaf0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ccc;
    }
    .panel-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #555;
      font-weight: 600;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .rwy-label { font-size: 11px; color: #777; }
    .rwy-btn {
      background: #fff;
      border: 1px solid #999;
      padding: 3px 12px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: #111;
      min-width: 48px;
    }
    .rwy-btn:hover { background: #f0f0f0; }
    .apron-toggle-btn {
      font-size: 11px;
      color: #777;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
    }
    .apron-toggle-btn:hover { color: #333; }

    /* ── Apron settings panel ── */
    .apron-panel {
      background: #f0f2f8;
      border-bottom: 1px solid #ccc;
      padding: 10px 16px;
    }
    .apron-panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .apron-panel-title {
      font-size: 10px;
      letter-spacing: 1px;
      color: #888;
    }
    .reset-btn {
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid #bbb;
      border-radius: 3px;
      background: #fff;
      color: #666;
      cursor: pointer;
    }
    .reset-btn:hover { background: #f0f0f0; }
    .apron-row {
      display: grid;
      grid-template-columns: 1fr 44px 44px;
      align-items: center;
      padding: 2px 0;
    }
    .apron-row.apron-col-header { margin-bottom: 2px; }
    .rwy-col-label {
      text-align: center;
      font-size: 10px;
      color: #777;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .apron-name { font-size: 11px; color: #444; }
    .apron-dot-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
    .dot-btn-green { background: #4caf50; border-color: #388e3c; }
    .dot-btn-red   { background: #f44336; border-color: #c62828; }
    .dot-btn-green:hover { background: #43a047; }
    .dot-btn-red:hover   { background: #e53935; }

    /* ── Column headers ── */
    .col-headers {
      display: grid;
      grid-template-columns: 120px 80px 1fr 80px;
      padding: 6px 16px;
      font-size: 10px;
      color: #888;
      letter-spacing: 1px;
      border-bottom: 2px solid #ccc;
      background: #eceef3;
    }
    .col-center { text-align: center; }

    /* ── Arrival rows ── */
    .arrival-row {
      display: grid;
      grid-template-columns: 120px 80px 1fr 80px;
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      align-items: center;
      font-family: 'Courier New', monospace;
    }
    .row-even { background: #fff; }
    .row-odd  { background: #f9f9fc; }
    .callsign  { font-weight: bold; color: #111; }
    .elt-col   { color: #333; }
    .stand-col { color: #333; }
    .stand-empty { color: #bbb; }
    .dot-cell { text-align: center; }

    .dot {
      display: inline-block;
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }
    .dot-grey   { background: #ccc; }
    .dot-green  { background: #4caf50; }
    .dot-yellow { background: #ffc107; }
    .dot-red    { background: #f44336; }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: #aaa;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    /* ── Demo controls ── */
    .demo-controls {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #fffbe6;
      border: 1px dashed #e0c040;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.14);
      z-index: 1000;
      min-width: 120px;
    }
    .demo-title {
      color: #b8860b;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 10px;
    }
    .demo-controls button {
      display: block;
      width: 100%;
      font-size: 10px;
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      margin-bottom: 4px;
      font-family: monospace;
    }
    .demo-controls button:last-child { margin-bottom: 0; }
    .demo-controls button:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="panel-header">
      <span class="panel-title">EOR ARRIVALS</span>
      <div class="header-right">
        <span class="rwy-label">LDG RWY</span>
        <button class="rwy-btn" @click="toggleRunway">{{ config.runway }}</button>
        <button class="apron-toggle-btn" @click="apronPanelOpen = !apronPanelOpen">
          {{ apronPanelOpen ? '▲' : '▼' }} Apron settings
        </button>
      </div>
    </div>

    <!-- Apron settings panel -->
    <div class="apron-panel" v-if="apronPanelOpen">
      <div class="apron-panel-top">
        <span class="apron-panel-title">APRON STATUS — WS SETTINGS</span>
        <button class="reset-btn" @click="resetAprons">Reset to default</button>
      </div>
      <div class="apron-row apron-col-header">
        <span></span>
        <span class="rwy-col-label">01L</span>
        <span class="rwy-col-label">19R</span>
      </div>
      <div class="apron-row" v-for="(settings, apron) in config.aprons" :key="apron">
        <span class="apron-name">{{ apron }}</span>
        <button :class="['apron-dot-btn', 'dot-btn-' + settings['01L']]" @click="toggleApron(apron, '01L')"></button>
        <button :class="['apron-dot-btn', 'dot-btn-' + settings['19R']]" @click="toggleApron(apron, '19R')"></button>
      </div>
    </div>

    <!-- Column headers -->
    <div class="col-headers">
      <span>CALLSIGN</span>
      <span>ELT</span>
      <span>EXP STAND</span>
      <span class="col-center">STATUS</span>
    </div>

    <!-- Arrivals list -->
    <div v-if="sortedArrivals.length === 0" class="empty-state">
      No RNP-capable arrivals within {{ LEAD_TIME_MIN }} min
    </div>
    <template v-else>
      <div
        class="arrival-row"
        v-for="(arrival, i) in sortedArrivals"
        :key="arrival.callsign"
        :class="i % 2 === 0 ? 'row-even' : 'row-odd'"
      >
        <span class="callsign">{{ arrival.callsign }}</span>
        <span class="elt-col">{{ formatTime(arrival.elt) }}</span>
        <span :class="['stand-col', !arrival.expectedStand ? 'stand-empty' : '']">
          {{ arrival.expectedStand || '—' }}
        </span>
        <span class="dot-cell">
          <span class="dot" :class="`dot-${dotColor(arrival)}`"></span>
        </span>
      </div>
    </template>

    <!-- Demo controls -->
    <div class="demo-controls" v-if="demoPanelVisible">
      <div class="demo-title">⚙ DEMO</div>
      <button @click="addArrival">+ Add arrival</button>
      <button @click="assignStands">Assign stands</button>
      <button @click="runScenario">Run scenario</button>
      <button @click="clearArrivals">Clear</button>
    </div>
  </div>

  <script>
    const LEAD_TIME_MIN = 60;
    const FREE_TIME_THRESHOLD_MIN = 15;
    const POLL_INTERVAL_SEC = 60;

    const APRON_NAMES = [
      'Ramp AB', 'Ramp BC', 'Ramp CD', 'Ramp D',  'Ramp E',
      'Ramp F',  'Ramp FA', 'Ramp G',  'Ramp H',  'Ramp J',
      'Ramp K',  'Ramp L',  'Ramp M',  'Ramp R',  'Ramp S',
      'Engine Test Site',
    ];

    function buildDefaultAprons() {
      const aprons = {};
      APRON_NAMES.forEach(name => { aprons[name] = { '01L': 'green', '19R': 'green' }; });
      return aprons;
    }

    function buildDemoAprons() {
      const aprons = buildDefaultAprons();
      aprons['Ramp K']['01L'] = 'red'; // demo: show red dot on load
      return aprons;
    }

    const { createApp } = Vue;

    createApp({
      data() {
        return {
          arrivals: [],
          config: {
            runway: '01R',
            aprons: buildDemoAprons(),
          },
          apronPanelOpen: false,
          demoPanelVisible: false,
          pollTimer: null,
          addIndex: 0,
          LEAD_TIME_MIN,
        };
      },

      computed: {
        sortedArrivals() {
          return [...this.arrivals].sort((a, b) => a.elt - b.elt);
        },
      },

      methods: {
        formatTime(date) {
          return date.toTimeString().slice(0, 5);
        },

        dotColor(arrival) {
          if (!arrival.expectedStand) return 'grey';
          const apron = STAND_APRON_MAP[arrival.expectedStand];
          if (!apron) return 'red';
          const eorRunway = this.config.runway === '01R' ? '01L' : '19R';
          if (this.config.aprons[apron][eorRunway] === 'red') return 'red';
          const threshold = new Date(arrival.elt.getTime() - FREE_TIME_THRESHOLD_MIN * 60000);
          if (!arrival.standFreeTime || arrival.standFreeTime <= threshold) return 'green';
          return 'yellow';
        },

        toggleRunway() {
          this.config.runway = this.config.runway === '01R' ? '19L' : '01R';
        },

        toggleApron(apron, runway) {
          const current = this.config.aprons[apron][runway];
          this.config.aprons[apron][runway] = current === 'green' ? 'red' : 'green';
        },

        resetAprons() {
          APRON_NAMES.forEach(name => {
            this.config.aprons[name]['01L'] = 'green';
            this.config.aprons[name]['19R'] = 'green';
          });
        },

        addArrival() {
          const pool = CHROMA_FLIGHTS.filter(f =>
            !this.arrivals.find(a => a.callsign === f.callsign)
          );
          if (pool.length === 0) return;
          const src = pool[this.addIndex % pool.length];
          this.addIndex++;
          const now = new Date();
          this.arrivals.push({
            callsign: src.callsign,
            elt: new Date(now.getTime() + 45 * 60000),
            expectedStand: null,
            standFreeTime: null,
            _resolvedStand: src._resolvedStand,
          });
        },

        assignStands() {
          this.arrivals.forEach(a => {
            if (!a.expectedStand && a._resolvedStand) {
              a.expectedStand = a._resolvedStand;
              a.standFreeTime = new Date(a.elt.getTime() - 20 * 60000);
            }
          });
        },

        runScenario() {
          const now = new Date();
          const add = m => new Date(now.getTime() + m * 60000);
          this.arrivals = [
            { callsign: 'SAS1234', elt: add(25), expectedStand: 'F32L', standFreeTime: add(8),  _resolvedStand: null },
            { callsign: 'BAW456',  elt: add(32), expectedStand: 'G143', standFreeTime: add(20), _resolvedStand: null },
            { callsign: 'FIN789',  elt: add(40), expectedStand: 'K3A',  standFreeTime: add(22), _resolvedStand: null },
            { callsign: 'DLH012',  elt: add(47), expectedStand: null,   standFreeTime: null,    _resolvedStand: 'F30' },
          ];
          this.addIndex = 0;
        },

        clearArrivals() {
          this.arrivals = [];
          this.addIndex = 0;
        },

        pollChroma() {
          console.log('[Chroma poll]', new Date().toTimeString().slice(0, 5));
        },

        handleKeydown(e) {
          if (e.shiftKey && e.key === 'D') this.demoPanelVisible = !this.demoPanelVisible;
        },
      },

      mounted() {
        const now = new Date();
        this.arrivals = CHROMA_FLIGHTS
          .filter(f => {
            const minsUntil = (f.elt - now) / 60000;
            return minsUntil > 0 && minsUntil <= LEAD_TIME_MIN;
          })
          .map(f => ({ ...f }));

        this.pollTimer = setInterval(this.pollChroma, POLL_INTERVAL_SEC * 1000);
        window.addEventListener('keydown', this.handleKeydown);
      },

      beforeUnmount() {
        clearInterval(this.pollTimer);
        window.removeEventListener('keydown', this.handleKeydown);
      },
    }).mount('#app');
  </script>
</body>
</html>
